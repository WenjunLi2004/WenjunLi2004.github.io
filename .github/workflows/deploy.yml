name: Deploy site

on:
  push:
    branches:
      - main
      - master
    paths:
      - "index.html"
      - "honors.html"
      - "404.html"
      - "robots.txt"
      - "sitemap.xml"
      - "CNAME"
      - ".nojekyll"
      - "assets/site/**"
      - "blog/**"
      - "cv/**"
      - "github/**"
      - "lehome/**"
      - "notes/**"
      - "paper/**"
      - "scholar/**"
      - ".well-known/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static artifact
        run: |
          mkdir -p _site/assets
          cp index.html honors.html 404.html robots.txt sitemap.xml CNAME .nojekyll _site/
          cp -R assets/site _site/assets/site
          cp -R blog cv github lehome notes paper scholar .well-known _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
