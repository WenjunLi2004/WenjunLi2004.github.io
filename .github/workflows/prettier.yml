name: Prettier

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
    paths:
      - "index.html"
      - "honors.html"
      - "404.html"
      - "assets/site/**"
      - "blog/**"
      - "cloudflare/**"
      - "cv/**"
      - "github/**"
      - "lehome/**"
      - "notes/**"
      - "paper/**"
      - "scholar/**"
      - "README.md"
      - "FONT_LICENSES.md"
      - ".github/workflows/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Run Prettier
        run: npx prettier@3.3.3 --check index.html honors.html 404.html blog/index.html cv/index.html github/index.html lehome/index.html notes/index.html paper/lehome/index.html scholar/index.html assets/site/main.js assets/site/styles.css cloudflare/domain-router.js cloudflare/README.md README.md FONT_LICENSES.md .github/workflows/*.yml
