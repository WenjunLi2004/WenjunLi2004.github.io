name: Prettier

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
    paths:
      - "index.html"
      - "honors.html"
      - "404.html"
      - "assets/site/**"
      - "README.md"
      - "FONT_LICENSES.md"
      - ".github/workflows/**"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Run Prettier
        run: npx prettier@3.3.3 --check index.html honors.html 404.html assets/site/main.js assets/site/styles.css README.md FONT_LICENSES.md .github/workflows/*.yml
